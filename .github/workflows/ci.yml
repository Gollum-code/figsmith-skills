name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Every committed IR must validate. A malformed IR is a broken deliverable, and
      # this is the cheapest check that catches it.
      - name: validate every IR
        shell: bash
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! python -m core.ir "$f"; then fail=1; fi
          done < <(find . -name '*.ir.json' -not -path './.git/*' -print0)
          exit $fail

      # Unit tests for the verifier contract, the judge no-fabrication rule, the token
      # loader, the router, and the drawio parser (incl. compressed files).
      - name: unit tests
        run: |
          python tests/test_verify.py
          python tests/test_parse_drawio.py
          python tests/test_security.py
          python tests/test_four_way.py
          python tests/test_regressions.py

      # The regression suite: validate + render + contrast + tiling + overflow, per
      # case, and blessed baselines must not drift.
      - name: regression suite
        run: python tools/regress.py

      # Every IR, four outputs, content must agree. Iterating all of them matters: the
      # statistical route renders through matplotlib, and an arch-only check silently
      # missed that it was producing empty SVGs.
      - name: four-way consistency
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            python tools/four_way_check.py "$f" || fail=1
            echo "::endgroup::"
          done < <(find . -name '*.ir.json' -not -path './.git/*' -print0)
          exit $fail

      # Token files must be internally consistent and every referenced color path
      # must resolve, or figures fail silently at render time.
      - name: token consistency
        run: python -m core.tokens.loader --check

      # The layout routes ship PDFs. A PDF that spilled onto a second page, or whose
      # text silently became an image, passes every raster check - so check the container.
      - name: pdf deliverables are single-page and vector
        shell: bash
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            python tools/pdf_check.py "$f" --expect-pages 1 || fail=1
          done < <(find examples -name '*.pdf' -not -path './.git/*' -print0)
          exit $fail

      # No hex literal may appear in code: colors go through the token path only
      # (METHOD 4). Allowed and self-documented: lines marked `# hex-ok` (render
      # fallbacks / CLI defaults), `.get()`/`.pop()` fallback args, and parameter
      # defaults. A bare hex anywhere else is a bypass of the token system.
      - name: no inline hex in code
        shell: bash
        run: |
          set -e
          hits=$(grep -rnE '#[0-9A-Fa-f]{6}\b' --include='*.py' core backends domains tools \
                 | grep -v '__pycache__/' \
                 | grep -vE 'hex-ok|\.get\(|\.pop\(|default=|# ->' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "inline hex found outside token defaults"
            exit 1
          fi
          echo "no inline hex in code"

      - name: catalog index and gallery in sync
        run: |
          python -m tools.catalog merge
          python -m tools.build_gallery
          git diff --exit-code gallery/
