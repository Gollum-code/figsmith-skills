<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>deck title slide</title>
<style>
  :root {
    --ink: #111827;
    --ink-2: #374151;
    --ink-3: #6B7280;
    --surface: #FFFFFF;
    --band: #EFF6FF;
    --accent: #2563EB;
    --accent-2: #EA580C;
    --grid: #E5E7EB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .page {
    width: 1280px; height: 720px;
    background: var(--surface);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
  }
  .accent-bar {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .kicker {
    font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 20px;
  }
  .title {
    font-size: 58px; font-weight: 800; line-height: 1.1;
    margin: 0 0 24px; max-width: 980px;
  }
  .subtitle {
    font-size: 22px; color: var(--ink-2); line-height: 1.5;
    margin: 0 0 48px; max-width: 820px;
  }
  .meta {
    display: flex; gap: 32px; font-size: 16px; color: var(--ink-3);
  }
  .meta b { color: var(--ink-2); font-weight: 600; }
</style>
<style>@page { size: 960.00pt 540.00pt; margin: 0; }html, body { margin: 0; padding: 0; width: 1280px; }</style><style>@page { size: 960.00pt 540.00pt; margin: 0; }html, body { margin: 0; padding: 0; width: 1280px; }</style></head>
<body>
  <div class="page">
    <div class="accent-bar"></div>
    <div class="kicker">Technical Talk</div>
    <h1 class="title">从 SVG 到 PDF：<br>统一风格的科学配图体系</h1>
    <p class="subtitle">一份源，七条后端，验收闭环自洽——让 AI 生成的图不再各说各话。</p>
    <div class="meta">
      <span><b>演讲人</b>　YG</span>
      <span><b>单位</b>　FigSmith Lab</span>
      <span><b>日期</b>　2026-04-18</span>
    </div>
  </div>
</body>
</html>
