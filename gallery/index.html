<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FigSmith 图型画廊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; background: #FAFAFA; color: #1A1D21; }
  header { background: #FFFFFF; border-bottom: 1px solid #E3E5E8; padding: 28px 40px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  header p { font-size: 14px; color: #6B7280; margin-top: 6px; }
  .controls { display: flex; gap: 12px; padding: 20px 40px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1; min-width: 240px; max-width: 420px; padding: 10px 14px; font-size: 15px;
            border: 1px solid #D0D4D9; border-radius: 8px; background: #fff; }
  .search:focus { outline: none; border-color: #0072B2; }
  .chip { padding: 7px 14px; font-size: 13px; border: 1px solid #D0D4D9; border-radius: 999px;
          background: #fff; cursor: pointer; }
  .chip[aria-pressed="true"] { background: #0072B2; border-color: #0072B2; color: #fff; }
  main { padding: 0 40px 56px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { background: #fff; border: 1px solid #E3E5E8; border-radius: 10px; padding: 18px 20px; }
  .card .domain { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #0072B2;
                  text-transform: uppercase; }
  .card h3 { font-size: 17px; font-weight: 600; margin: 8px 0 4px; }
  .card .id { font-family: Consolas, monospace; font-size: 12px; color: #6B7280; }
  .card .route { display: inline-block; margin-top: 12px; padding: 3px 9px; border-radius: 4px;
                 font-size: 11px; font-weight: 600; background: #F4F6F8; color: #4B5158; }
  .card .route.structure { background: #EAF2F8; color: #084594; }
  .card .route.statistical { background: #F1F8F6; color: #00441B; }
  .card .route.html { background: #FFF5EB; color: #A63603; }
  .card .kw { margin-top: 10px; font-size: 12px; color: #8E959D; line-height: 1.6; }
  .empty { padding: 60px 0; text-align: center; color: #6B7280; font-size: 15px; }
  footer { padding: 24px 40px; color: #8E959D; font-size: 12px; border-top: 1px solid #E3E5E8; }
</style>
</head>
<body>
<header>
  <h1>FigSmith 图型画廊</h1>
  <p id="summary">加载中…</p>
</header>

<div class="controls">
  <input class="search" id="search" type="search" placeholder="搜索图型：关键词 / id / 名称…" aria-label="搜索图型">
  <div id="chips"></div>
</div>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>没有匹配的图型。</div></main>
<footer>静态页面，数据来自 catalog.json。域包新增 references/catalog.json 后跑
  <code>python -m tools.catalog merge</code> 重建索引。</footer>

const DATA = Promise.resolve(CATALOG);

DATA.then(index => {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const summary = document.getElementById("summary");
  const chips = document.getElementById("chips");

  summary.textContent = `${index.domains.length} 个域 · ${index.chart_types.length} 个图型`;

  // domain filter chips
  const domains = ["all", ...index.domains.map(d => d.id).sort()];
  domains.forEach(d => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = d === "all" ? "全部" : d;
    b.setAttribute("aria-pressed", String(d === "all"));
    b.onclick = () => {
      state.domain = d;
      chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      render();
    };
    chips.appendChild(b);
  });

  document.getElementById("search").addEventListener("input", e => {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  function render() {
    const q = state.query;
    const hits = index.chart_types.filter(e => {
      if (state.domain !== "all" && e.domain !== state.domain) return false;
      if (!q) return true;
      return (e.id + " " + (e.name || "") + " " + e.domain + " " +
              (e.keywords || []).join(" ")).toLowerCase().includes(q);
    });
    grid.innerHTML = "";
    empty.hidden = hits.length > 0;
    hits.forEach(e => {
      const card = document.createElement("article");
      card.className = "card";
      const route = e.route || "?";
      card.innerHTML =
        `<div class="domain">${e.domain}</div>` +
        `<h3>${e.name || e.id}</h3>` +
        `<div class="id">${e.id}</div>` +
        `<span class="route ${route}">${route}</span>` +
        (e.keywords && e.keywords.length ? `<div class="kw">${e.keywords.join(" · ")}</div>` : "");
      grid.appendChild(card);
    });
  }
  render();
}).catch(err => {
  document.getElementById("summary").textContent = "catalog.json 加载失败：" + err.message;
});
</script>
</body>
</html>
